name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://starter:starter@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint 경계 규칙, Prettier)
        run: pnpm lint
      - name: 명세 검사 (형식, 시나리오↔테스트, 코드 경로)
        run: pnpm spec:check
      - name: 하네스 테스트 (커밋 가드, 명세 검사, 편집 가드, 경계 규칙)
        run: pnpm test:tooling
      - name: 타입 검사
        run: pnpm typecheck
      - name: 테스트 (서버 통합 테스트는 실제 PostgreSQL에서)
        run: pnpm test
      - name: 웹·데스크톱 빌드
        run: pnpm --filter @starter/web --filter @starter/desktop build

  e2e:
    # 실제 서버·웹을 띄우고 브라우저로 가입 → 글쓰기 → 실시간 알림 흐름을 확인한다.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://starter:starter@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright 브라우저 설치
        run: pnpm --filter @starter/web exec playwright install --with-deps chromium
      - name: E2E (Playwright, 서버와 웹을 함께 띄움)
        run: pnpm --filter @starter/web test:e2e
