name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://starter:starter@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint with import boundaries, Prettier)
        run: pnpm lint
      - name: Specs are linked to tests
        run: pnpm spec:check
      - name: Harness tests (commit guard, spec check, edit guard, lint rule)
        run: pnpm test:tooling
      - run: pnpm typecheck
      - name: Tests (server integration tests run on Postgres)
        run: pnpm test
      - name: Build web and desktop
        run: pnpm --filter @starter/web --filter @starter/desktop build
